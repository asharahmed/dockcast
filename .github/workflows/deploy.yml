name: deploy
on:
  workflow_run:
    workflows: [ci]
    branches: [main]
    types: [completed]
permissions: { contents: read, packages: write }
jobs:
  images:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        include:
          - { name: api,       file: apps/api/Dockerfile }
          - { name: collector, file: apps/collector/Dockerfile }
          - { name: worker,    file: ml/Dockerfile }
          - { name: caddy,     file: infra/caddy/Dockerfile }
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ github.event.workflow_run.head_sha }}" }
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/dockcast-${{ matrix.name }}:latest
            ghcr.io/${{ github.repository_owner }}/dockcast-${{ matrix.name }}:${{ github.event.workflow_run.head_sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max
  # Rollouts are opt-in through the repository variable DEPLOY_TARGET ('vps' or 'homeserver'),
  # so a fork or a repo without deploy secrets gets a green workflow: the job is skipped, not failed.
  rollout-vps:
    if: ${{ vars.DEPLOY_TARGET == 'vps' }}
    needs: images
    runs-on: ubuntu-24.04
    steps:
      - uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd /opt/dockcast && git pull --ff-only
            cd infra
            docker compose pull
            docker compose up -d --remove-orphans
            docker image prune -f
            docker compose ps
  rollout-homeserver:
    # Windows + Docker Desktop host (default) or Linux + Docker Engine host (repo variable
    # HOMESERVER_OS=linux) reachable only over Tailscale (docs/infra.md §16): the runner joins the
    # tailnet as an ephemeral tag:ci node, then runs infra/scripts/rollout-homeserver.ps1 (or .sh)
    # on the host, which fetches this commit's tarball, pulls the images just pushed and restarts.
    if: ${{ vars.DEPLOY_TARGET == 'homeserver' }}
    needs: images
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ github.event.workflow_run.head_sha }}" }
      - uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
      - name: Roll out over ssh
        env:
          HOST: ${{ secrets.HOMESERVER_HOST }}
          USER: ${{ secrets.HOMESERVER_USER }}
          KEY: ${{ secrets.HOMESERVER_SSH_KEY }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          HOMESERVER_OS: ${{ vars.HOMESERVER_OS || 'windows' }}
          HOMESERVER_DIR: ${{ vars.HOMESERVER_DIR }}
        run: |
          mkdir -p ~/.ssh && printf '%s\n' "$KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          opts="-o StrictHostKeyChecking=accept-new -o ConnectTimeout=20 -i $HOME/.ssh/deploy_key"
          if [ "$HOMESERVER_OS" = linux ]; then
            dir_arg=""; [ -n "$HOMESERVER_DIR" ] && dir_arg=" --dir $HOMESERVER_DIR"
            scp $opts infra/scripts/rollout-homeserver.sh "$USER@$HOST:rollout-homeserver.sh"
            ssh $opts "$USER@$HOST" "bash rollout-homeserver.sh --sha $SHA$dir_arg"
          else
            scp $opts infra/scripts/rollout-homeserver.ps1 "$USER@$HOST:rollout-homeserver.ps1"
            ssh $opts "$USER@$HOST" "powershell -NoProfile -ExecutionPolicy Bypass -File rollout-homeserver.ps1 -Sha $SHA"
          fi
