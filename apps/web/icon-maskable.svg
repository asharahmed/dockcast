<!-- Source for icons/icon-maskable-512.png and icons/apple-touch-icon.png: full-bleed
     tile (no corner radius; the platform applies its own mask), glyph at 80% for the
     safe zone. Regenerate: rsvg-convert -w 512 -h 512 icon-maskable.svg -o public/icons/icon-maskable-512.png
     and -w 180 -h 180 for apple-touch-icon.png. Rounded-tile icons come from public/favicon.svg. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <rect width="32" height="32" fill="#1c4f8f"/>
  <g transform="translate(16 16) scale(0.8) translate(-16 -16)">
    <path d="M10 24 V8 h4 A8 8 0 0 1 19.66 21.66" fill="none" stroke="#fdfcfa" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="15.7" cy="23.7" r="2.5" fill="#fdfcfa"/>
  </g>
</svg>
