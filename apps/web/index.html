<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="icon" href="/favicon.ico?v=5" sizes="32x32" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=5" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png?v=5" />
    <!-- Home-screen icon on iOS: 180 px, opaque, at the root path iOS also probes on its own.
         The ?v= on every icon and on the manifest is a cache key: iOS keeps a failed icon fetch
         per URL, and devices that ran the earlier service worker hold an old manifest. Bump it
         whenever an icon or the manifest's icons change. -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=5" />
    <link rel="manifest" href="/site.webmanifest?v=5" />
    <meta name="theme-color" content="#fdfcfa" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1c1c1a" media="(prefers-color-scheme: dark)" />
    <!-- Installed-app chrome (PWA). iOS reads the apple-* tags; "default" keeps the status
         bar opaque so the header never sits under it. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>DockCast</title>
    <meta name="description" content="Bike-share availability forecasts for when you'll actually be at the station. Will there be a bike? Will there be a dock? Calibrated odds, scored in public." />
    <meta name="application-name" content="DockCast" />
    <meta name="apple-mobile-web-app-title" content="DockCast" />
    <!-- Social previews. __PUBLIC_BASE_URL__ is replaced at build time (vite.config.ts) because
         og:url / og:image have to be absolute. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="DockCast" />
    <meta property="og:title" content="DockCast" />
    <meta property="og:description" content="Bike-share availability forecasts for when you'll actually be at the station." />
    <meta property="og:url" content="__PUBLIC_BASE_URL__/" />
    <meta property="og:image" content="__PUBLIC_BASE_URL__/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- ui-spec.md §2.1 originally called for a pre-paint inline <script> here to apply a
         saved theme before first paint. The api's CSP (`script-src 'self'`, no
         'unsafe-inline'/nonce) blocks inline scripts, so that bootstrap silently never ran
         in any deployed environment and a saved preference was ignored on every fresh page
         load. The equivalent logic now runs synchronously at the top of src/main.tsx
         instead (CSP-safe); it no longer prevents the first-paint flash, but the theme
         preference itself is honoured again. See WP-12 final report. -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
